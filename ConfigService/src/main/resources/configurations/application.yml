# ====================================================
# Common Configuration for ALL Microservices
# Served by Spring Cloud Config Server
# ====================================================

# --- Database (MySQL) ---
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:foodapplicationproject.c8nmk0ko6see.us-east-1.rds.amazonaws.com}:${DB_PORT:3306}/Food_Application_Platform?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:Krishna81433*}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  # --- Security ---
  security:
    user:
      name: ${SECURITY_USER:food}
      password: ${SECURITY_PASSWORD:food}

  # --- Kafka ---
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:${EC2_PRIVATE_IP:localhost}:9092}

# --- Eureka Client ---
eureka:
  client:
    enableJersey: false
    registerWithEureka: true
    fetchRegistry: true
    enabled: true
    service-url:
      defaultZone: ${EUREKA_URL:http://food:food@localhost:8761/eureka/}

# --- JWT ---
jwt:
  secret: ${JWT_SECRET:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}

# --- Swagger / SpringDoc ---
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# --- Logging ---
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
